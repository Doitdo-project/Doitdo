spring:
  datasource:
    url: "jdbc:h2:mem:doitdo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false

# 테스트 전용 JWT 시크릿. h2 메모리 DB 와 짝을 이뤄 dev/prod 와 격리된 값.
jwt:
  secret: test-only-jwt-secret-for-h2-in-memory-db-must-be-long-enough-for-hmac-sha-256

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

apple:
  signin:
    # 테스트 전용 더미 Apple Sign-in 설정. 실제 Apple Developer 키가 아니다.
    team-id: TESTTEAMID
    key-id: TESTKEYID
    key-path: src/test/resources/apple-test-key.p8
    client-id: com.d107.doitdo.test

app:
  terms:
    version: "1.0"
