spring:
  application:
    name: doitdo
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: redis
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        "[format_sql]": ${JPA_FORMAT_SQL:false}
  # 비밀번호 재설정 메일 발송용 SMTP 설정.
  # MVP 는 Gmail SMTP + 앱 비밀번호 사용. 운영 단계에서 SES/SendGrid 로 host/port 만 교체 예정.
  # MAIL_USERNAME / MAIL_PASSWORD 미설정 시 메일 발송은 실패하지만 부팅은 성공 (자체회원 비번재설정만 영향).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  # JWT_SECRET 은 환경변수로만 주입한다 (fallback 없음).
  # - dev: be/env/.env.dev 의 JWT_SECRET
  # - prod: Jenkins 의 prod-env-file Credential 의 JWT_SECRET (dev 와 반드시 다른 값)
  # - local: application-local.yml 에서 하드코딩 fallback 제공 (h2 메모리 DB 전용)
  # 미설정 시 부팅 실패 — prod 가 dev secret 으로 silent boot 되는 사고 방지.
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

apple:
  oauth:
    # iOS 네이티브 Sign in with Apple 의 audience(앱 Bundle Identifier).
    # Web/Service ID 등 다른 클라이언트가 추가되면 다중 audience 지원으로 확장 필요.
    client-id: ${APPLE_OAUTH_CLIENT_ID:}
  signin:
    # Apple Developer 콘솔에서 발급받은 Sign in with Apple Key (.p8) 관련 설정.
    # 회원가입 시 authorizationCode 교환과 회원탈퇴 시 토큰 revoke 호출의 client_secret JWT 서명에 사용.
    # 누락 시 부팅 실패 (silent failure 방지).
    team-id: ${APPLE_SIGNIN_TEAM_ID:}
    key-id: ${APPLE_SIGNIN_KEY_ID:}
    # 상대경로 가능 — working directory 기준 (./gradlew bootRun 은 be/ 에서 실행됨, Docker 도 WORKDIR=/app/ 동일).
    key-path: ${APPLE_SIGNIN_KEY_PATH:}
    # client_secret JWT 의 sub 값. 보통 oauth.client-id 와 동일 (앱 Bundle Identifier).
    client-id: ${APPLE_SIGNIN_CLIENT_ID:com.d107.doitdo}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:}

notification:
  evening-reminder:
    enabled: ${NOTIFICATION_EVENING_REMINDER_ENABLED:true}
  morning-reminder:
    enabled: ${NOTIFICATION_MORNING_REMINDER_ENABLED:true}

logging:
  level:
    org.hibernate.SQL: ${LOG_HIBERNATE_SQL:INFO}
    org.hibernate.orm.jdbc.bind: ${LOG_HIBERNATE_BIND:WARN}

# CORS 허용 origin. profile 별 yml 에서 override — base 는 빈 값으로 두어 명시적으로 설정하지 않으면 외부 호출 차단.
# 모바일 앱은 CORS 영향 없음 — 웹/swagger/외부 도구용.
app:
  cors:
    allowed-origins: ""
  terms:
    version: "1.0"
  # 비밀번호 재설정 OTP 정책. 6자리 인증번호 발급(TTL otp-ttl-minutes) → 검증 통과 시 짧은 reset 토큰 발급(TTL reset-token-ttl-minutes).
  # otp 시도가 max-attempts 회 초과되면 Redis 키 삭제 후 재요청 강제 (A04-005).
  password-reset:
    otp-ttl-minutes: ${APP_PASSWORD_RESET_OTP_TTL_MINUTES:10}
    reset-token-ttl-minutes: ${APP_PASSWORD_RESET_TOKEN_TTL_MINUTES:5}
    max-attempts: ${APP_PASSWORD_RESET_MAX_ATTEMPTS:5}
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:doitdo}
