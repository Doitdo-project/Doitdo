spring:
  config:
    import: "optional:file:./env/.env.dev[.properties]"
  datasource:
    url: jdbc:mariadb://${db.host}:${db.port}/${db.name}
    username: ${db.username}
    password: ${db.password}

server:
  forward-headers-strategy: framework

# dev 는 로컬 개발자 + dev 스웨거가 호출 가능하도록 localhost / dev-api 도메인 허용.
app:
  cors:
    allowed-origins: "http://localhost:*,https://dev-api.doitdo.site,https://dev.doitdo.site"

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
