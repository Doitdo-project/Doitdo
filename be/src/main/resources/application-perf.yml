spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

auth:
  user-cache:
    provider: ${AUTH_USER_CACHE_PROVIDER:none}
    ttl: ${AUTH_USER_CACHE_TTL:60s}
    max-size: ${AUTH_USER_CACHE_MAX_SIZE:10000}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.stat: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.doitdo.domain.auth.application.cache: INFO
