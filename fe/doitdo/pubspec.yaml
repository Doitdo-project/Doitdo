name: doitdo
description: "다마고치를 키우는 TODO 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 캘린더
  table_calendar: ^3.1.2

  # 상태관리 / MVVM
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 모델 / 직렬화
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 라우팅
  go_router: ^14.8.1

  # 네트워킹
  dio: ^5.7.0
  retrofit: 4.9.0

  # 푸시 알림
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^17.2.4

  # OS 알림 설정 페이지 열기 (iOS/Android).
  # 알림 설정 페이지에서 푸시알림 토글이 OS 알림 권한 상태를 반영하고,
  # 토글 탭 시 OS 알림 설정 페이지로 보내기 위해 사용 (NotificationSettingsPage).
  app_settings: ^5.1.1

  # OS 알림 권한 상태 조회 / 요청.
  # 알림 설정 페이지의 푸시알림 토글이 이걸로 권한 상태를 읽어 비주얼에 반영하고,
  # 권한 미허용 상태에서 토글 탭 시 권한 요청 다이얼로그를 띄운다.
  permission_handler: ^11.3.1

  # 로컬 저장
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # 환경변수
  flutter_dotenv: ^5.2.1

  # 유틸
  logger: ^2.5.0
  intl: ^0.20.2

  # 반응형 UI
  flutter_screenutil: ^5.9.3

  # 소셜 로그인 — Apple Sign In (iOS 전용).
  # Android 에서는 import 해도 빌드 OK. 실제 호출은 Platform.isIOS 로 가드한다.
  # App Store 심사 규정 4.8 준수를 위해 iOS 에서 Google/Kakao 와 함께 반드시 제공.
  sign_in_with_apple: ^6.1.0
  # Google Sign In — Android/iOS 공통.
  google_sign_in: ^6.2.1

  # Kakao Login — Android/iOS 공식 SDK.
  # 카카오톡 앱 설치 시 앱-투-앱 로그인, 미설치 시 카카오계정 웹 로그인 폴백.
  # 실제 호출은 AuthRepositoryImpl.signInWithKakao 가 담당.
  kakao_flutter_sdk_user: ^1.9.5

  # 토큰 안전 저장 (iOS: Keychain, Android: EncryptedSharedPreferences).
  # OAuth 로 발급된 access/refresh 토큰은 반드시 이걸로 보관. SharedPreferences 금지.
  flutter_secure_storage: ^9.2.2

  # 카메라 촬영 / 갤러리 이미지 선택.
  # Android 13+ 에선 Photo Picker 로 별도 권한 불필요, 카메라 사용 시 CAMERA 권한 필요 (manifest).
  # iOS 는 Info.plist 에 NSCameraUsageDescription / NSPhotoLibraryUsageDescription 필요 (Mac 빌드 시).
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.4
  retrofit_generator: ^9.7.0

  # 테스트
  mockito: ^5.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/mock_api/
    - assets/seeds/
    - .env

  # 폰트 파일은 assets/fonts/ 에 아래 파일명과 정확히 일치하도록 배치해야 합니다.
  # 파일명/family 를 바꿀 때는 lib/core/theme/app_text_styles.dart 의 상수도 함께 수정하세요.
  fonts:
    - family: GmarketSansLight
      fonts:
        - asset: assets/fonts/GmarketSansLight.ttf
          weight: 300
    - family: GmarketSansMedium
      fonts:
        - asset: assets/fonts/GmarketSansMedium.ttf
          weight: 500
    - family: GmarketSansBold
      fonts:
        - asset: assets/fonts/GmarketSansBold.ttf
          weight: 700
