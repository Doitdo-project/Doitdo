<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    웹 프리뷰 모드 진입용 경로 매핑.
    - `/preview(/...)`  → `?preview=1` 쿼리로 변환 후 루트로 이동 (WebPreviewShell 켜짐)
    - `/app(/...)`      → `?preview=0` 쿼리로 변환 후 루트로 이동 (WebPreviewShell 꺼짐)
    history.replaceState 를 쓰므로 뒤로가기 히스토리가 더럽혀지지 않는다.
    Flutter 부트스트랩 전에 실행돼야 하므로 <head> 상단에서 처리.
  -->
  <script>
    (function () {
      var path = window.location.pathname || '/';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      function appendParam(qs, key, value) {
        var sep = qs && qs.length > 1 ? '&' : '?';
        return (qs || '') + sep + key + '=' + value;
      }

      if (path.indexOf('/preview') === 0) {
        var nextSearch = /(^|[?&])preview=/.test(search)
          ? search
          : appendParam(search, 'preview', '1');
        window.history.replaceState(null, '', '/' + nextSearch + hash);
      } else if (path.indexOf('/app') === 0) {
        var nextSearch2 = /(^|[?&])preview=/.test(search)
          ? search
          : appendParam(search, 'preview', '0');
        window.history.replaceState(null, '', '/' + nextSearch2 + hash);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="doitdo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>doitdo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
